<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 414" width="600" height="414" role="img" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Fundus captioning framework</title>
<desc>1: dataset of 1.64 million retinal images, filtered with CLIP, with 1.38 million captions rewritten from the clinical notes by an LLM and patient-level splits. 2: LoRA fine-tuning of three open-weight vision-language models of 4 to 7 billion parameters: Qwen3-VL, MedGemma and LLaVA-Med. 3: evaluation on 211,151 test images with captioning metrics, clinical-concept F1 and an LLM judge.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0.8 L10 5 L0 9.2 z" fill="#8a8a8a"/></marker></defs>
<rect width="600" height="414" fill="#ffffff"/>
<rect x="22" y="24" width="556" height="112" rx="10" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.3"/><circle cx="46" cy="48" r="11" fill="#8c1515"/><text x="46" y="52.6" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text><text x="66" y="53" font-size="15.5" font-weight="700" fill="#1a1a1a">Dataset</text>
<rect x="40" y="78" width="150" height="30" rx="15" fill="#f4f4f2" stroke="#dddddd" stroke-width="1.2"/><text x="115.0" y="98" text-anchor="middle" font-size="13" font-weight="400" fill="#555555">1.64M retinal images</text>
<line x1="194" y1="93" x2="214" y2="93" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="218" y="78" width="120" height="30" rx="15" fill="#f4f4f2" stroke="#dddddd" stroke-width="1.2"/><text x="278.0" y="98" text-anchor="middle" font-size="13" font-weight="400" fill="#555555">CLIP filtering</text>
<line x1="342" y1="93" x2="362" y2="93" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="366" y="78" width="196" height="30" rx="15" fill="#f4f4f2" stroke="#dddddd" stroke-width="1.2"/><text x="464.0" y="98" text-anchor="middle" font-size="13" font-weight="400" fill="#555555">1.38M captions from notes</text>
<text x="40" y="127" font-size="12" fill="#64748b">captions rewritten from the clinical notes by an LLM; patient-level splits</text>
<line x1="300" y1="138" x2="300" y2="160" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="22" y="164" width="556" height="96" rx="10" fill="#f9f0f0" stroke="#8c1515" stroke-width="1.6"/><circle cx="46" cy="188" r="11" fill="#8c1515"/><text x="46" y="192.6" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text><text x="66" y="193" font-size="15.5" font-weight="700" fill="#1a1a1a">LoRA fine-tuning of open-weight VLMs (4 to 7B)</text>
<rect x="66" y="214" width="136" height="30" rx="15" fill="#ffffff" stroke="#8c1515" stroke-width="1.2"/><text x="134.0" y="234" text-anchor="middle" font-size="13" font-weight="700" fill="#8c1515">Qwen3-VL</text>
<rect x="232" y="214" width="136" height="30" rx="15" fill="#ffffff" stroke="#8c1515" stroke-width="1.2"/><text x="300.0" y="234" text-anchor="middle" font-size="13" font-weight="700" fill="#8c1515">MedGemma</text>
<rect x="398" y="214" width="136" height="30" rx="15" fill="#ffffff" stroke="#8c1515" stroke-width="1.2"/><text x="466.0" y="234" text-anchor="middle" font-size="13" font-weight="700" fill="#8c1515">LLaVA-Med</text>
<line x1="300" y1="262" x2="300" y2="284" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="22" y="288" width="556" height="96" rx="10" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.3"/><circle cx="46" cy="312" r="11" fill="#8c1515"/><text x="46" y="316.6" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text><text x="66" y="317" font-size="15.5" font-weight="700" fill="#1a1a1a">Evaluation on 211,151 test images</text>
<rect x="40" y="338" width="158" height="30" rx="15" fill="#f4f4f2" stroke="#dddddd" stroke-width="1.2"/><text x="119.0" y="358" text-anchor="middle" font-size="13" font-weight="400" fill="#555555">captioning metrics</text>
<rect x="214" y="338" width="166" height="30" rx="15" fill="#f4f4f2" stroke="#dddddd" stroke-width="1.2"/><text x="297.0" y="358" text-anchor="middle" font-size="13" font-weight="400" fill="#555555">clinical-concept F1</text>
<rect x="396" y="338" width="166" height="30" rx="15" fill="#f4f4f2" stroke="#dddddd" stroke-width="1.2"/><text x="479.0" y="358" text-anchor="middle" font-size="13" font-weight="400" fill="#555555">LLM judge</text>
</svg>
