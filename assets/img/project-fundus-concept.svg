<path d="M 111.0 228.0 C 108.7 225.7, 100.7 217.0, 97.0 214.0 C 93.3 211.0, 90.3 210.7, 89.0 210.0" fill="none" stroke="#a3301f" stroke-width="1.3" stroke-linecap="round" opacity="0.95"/>
<circle cx="169.0" cy="198.0" r="30" fill="url(#glow)"/>
<circle cx="169.0" cy="198.0" r="17" fill="url(#disc)"/>
<circle cx="171.0" cy="197.0" r="6.5" fill="#fffbea" opacity="0.9"/>
</g>
<circle cx="129.0" cy="207.0" r="95" fill="url(#vignette)"/>
<line x1="248" y1="207.0" x2="346" y2="207.0" stroke="#64748b" stroke-width="2.2" marker-end="url(#head)"/>
<rect x="243.0" y="157.0" width="104" height="30" rx="15" fill="#f9f0f0" stroke="#8c1515" stroke-width="1.5"/>
<text x="295.0" y="177.0" text-anchor="middle" font-size="14" font-weight="700" fill="#8c1515">VLM + LoRA</text>
<text x="295.0" y="231.0" text-anchor="middle" font-size="12" fill="#64748b">Qwen3-VL</text>
<text x="295.0" y="246.0" text-anchor="middle" font-size="12" fill="#64748b">MedGemma</text>
<text x="295.0" y="261.0" text-anchor="middle" font-size="12" fill="#64748b">LLaVA-Med</text>
<rect x="358" y="100" width="220" height="214" rx="10" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.4"/>
<rect x="358" y="114" width="4" height="186" rx="2" fill="#8c1515"/>
<text x="376" y="130" font-size="14.5" font-weight="700" fill="#1a1a1a">Clinical description</text>
<text x="376" y="158" font-size="13" fill="#555555">Optic disc pink with sharp</text>
<text x="376" y="179" font-size="13" fill="#555555">margins, cup-to-disc ratio 0.3.</text>
<text x="376" y="200" font-size="13" fill="#555555">Macula flat, foveal reflex</text>
<text x="376" y="221" font-size="13" fill="#555555">present. Vessels of normal</text>
<text x="376" y="242" font-size="13" fill="#555555">caliber. No hemorrhages</text>
<text x="376" y="263" font-size="13" fill="#555555">or exudates.</text>
<text x="376" y="300" font-size="11.5" font-style="italic" fill="#64748b">illustrative example</text>
<text x="129.0" y="342" text-anchor="middle" font-size="13" fill="#64748b">fundus photograph (stylized)</text>
<text x="468.0" y="342" text-anchor="middle" font-size="13" fill="#64748b">generated description</text>
</svg>
