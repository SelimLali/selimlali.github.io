<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 414" width="600" height="414" role="img" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>From a fundus photograph to a clinical description</title>
<desc>A stylized fundus photograph (drawn, not a real image) goes through a vision-language model fine-tuned with LoRA (Qwen3-VL, MedGemma or LLaVA-Med), which writes a clinical description. The description shown is an illustrative example.</desc>
<defs>
<radialGradient id="retina" cx="62%" cy="46%" r="62%"><stop offset="0" stop-color="#f7a65e"/><stop offset="0.45" stop-color="#e2773f"/><stop offset="0.8" stop-color="#b5412b"/><stop offset="1" stop-color="#7a1c16"/></radialGradient>
<radialGradient id="vignette" cx="50%" cy="50%" r="50%"><stop offset="0.72" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.55"/></radialGradient>
<radialGradient id="macula" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#7a2418" stop-opacity="0.75"/><stop offset="1" stop-color="#7a2418" stop-opacity="0"/></radialGradient>
<radialGradient id="disc" cx="45%" cy="45%" r="55%"><stop offset="0" stop-color="#fff6d2"/><stop offset="0.7" stop-color="#f6d27e"/><stop offset="1" stop-color="#e9a95a"/></radialGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0.4" stop-color="#ffd98a" stop-opacity="0.55"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient>
<clipPath id="field"><circle cx="129.0" cy="207.0" r="95"/></clipPath>
<marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0.8 L10 5 L0 9.2 z" fill="#64748b"/></marker>
</defs>
<rect width="600" height="414" fill="#ffffff"/>
<text x="22" y="58" font-size="19" font-weight="700" fill="#1a1a1a">From a fundus photograph to a clinical description</text>
<rect x="22" y="100" width="214" height="214" rx="14" fill="#0b0b0c"/>
<circle cx="129.0" cy="207.0" r="95" fill="url(#retina)"/>
<g clip-path="url(#field)">
<circle cx="94.0" cy="213.0" r="26" fill="url(#macula)"/>
<circle cx="94.0" cy="213.0" r="1.8" fill="#ffd9a8" opacity="0.9"/>
