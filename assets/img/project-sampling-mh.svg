<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Blockwise Metropolis&#8211;Hastings power sampling</title>
<desc>The completion is generated block by block after the prompt. 1: the next block of B tokens is sampled from the base model at temperature one over alpha. 2: N_MCMC times, every token after a random token t is resampled and the new text is accepted with the Metropolis&#8211;Hastings probability for the power distribution, otherwise the current text is kept. 3: the result is kept and the next block is added, until the length limit.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L10 5 L0 9.2 z" fill="#64748b"/></marker></defs>
<rect width="600" height="360" fill="#ffffff"/>
<circle cx="30" cy="60.0" r="13" fill="#8c1515"/><text x="30" y="65.0" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text><text x="52" y="66.0" font-size="17" font-weight="700" fill="#1a1a1a">Extend</text><text x="52" y="87.0" font-size="13" fill="#555555">sample B more tokens from the</text><text x="52" y="104.0" font-size="13" fill="#555555">base model at temperature 1/&#945;</text>
<rect x="286.0" y="46" width="58.0" height="32" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="315.0" y="66" text-anchor="middle" font-size="12.5" fill="#64748b">prompt</text>
<rect x="349.0" y="46" width="56.0" height="32" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<rect x="410.0" y="46" width="56.0" height="32" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<rect x="471.0" y="46" width="56.0" height="32" rx="5" fill="#f3dede" stroke="#8c1515" stroke-width="1.7" stroke-dasharray="5 4"/><text x="499.0" y="66" text-anchor="middle" font-size="12.5" fill="#8c1515">new</text>
<circle cx="30" cy="172.0" r="13" fill="#8c1515"/><text x="30" y="177.0" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text><text x="52" y="178.0" font-size="17" font-weight="700" fill="#1a1a1a">Refine &#215; N<tspan dy="4" font-size="11">MCMC</tspan></text><text x="52" y="199.0" font-size="13" fill="#555555">resample after a random token t,</text><text x="52" y="216.0" font-size="13" fill="#555555">accept with the Metropolis&#8211;Hastings</text><text x="52" y="233.0" font-size="13" fill="#555555">probability for p<tspan dy="-6" font-size="9.5">&#945;</tspan><tspan dy="6">, else keep</tspan></text>
<rect x="286.0" y="158" width="58.0" height="32" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="315.0" y="178" text-anchor="middle" font-size="12.5" fill="#64748b">prompt</text>
<rect x="349.0" y="158" width="56.0" height="32" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<rect x="410.0" y="158" width="56.0" height="32" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<rect x="471.0" y="158" width="56.0" height="32" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<rect x="432.4" y="153" width="99.6" height="42" rx="4" fill="#8c1515" fill-opacity="0.22" stroke="#8c1515" stroke-width="1.7"/>
<line x1="432.4" y1="145" x2="432.4" y2="203" stroke="#8c1515" stroke-width="1.8"/>
<text x="432.4" y="140" text-anchor="middle" font-size="14" font-style="italic" fill="#8c1515">t</text>
<text x="481.7" y="217" text-anchor="middle" font-size="12.5" fill="#8c1515">resampled</text>
<path d="M 539.0 194 C 571.0 194, 571.0 154, 541.0 154" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="557.0" y="144" text-anchor="middle" font-size="12.5" fill="#64748b">&#215; N<tspan dy="4" font-size="11">MCMC</tspan></text>
<circle cx="30" cy="284.0" r="13" fill="#8c1515"/><text x="30" y="289.0" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text><text x="52" y="290.0" font-size="17" font-weight="700" fill="#1a1a1a">Repeat</text><text x="52" y="311.0" font-size="13" fill="#555555">keep the result, add the next</text><text x="52" y="328.0" font-size="13" fill="#555555">block, until the length limit</text>
<rect x="286.0" y="270" width="58.0" height="32" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="315.0" y="290" text-anchor="middle" font-size="12.5" fill="#64748b">prompt</text>
<rect x="349.0" y="270" width="56.0" height="32" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<rect x="410.0" y="270" width="56.0" height="32" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<rect x="432.4" y="271" width="32.6" height="30" fill="#f3dede"/>
<rect x="471.0" y="270" width="56.0" height="32" rx="5" fill="#f3dede" stroke="#64748b" stroke-width="1.5"/>
<line x1="432.4" y1="273" x2="432.4" y2="299" stroke="#8c1515" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="532.0" y="270" width="34.7" height="32" rx="5" fill="#f3dede" stroke="#8c1515" stroke-width="1.7" stroke-dasharray="5 4"/><text x="549.4" y="290" text-anchor="middle" font-size="12.5" fill="#8c1515">next</text>
<text x="573.7" y="291" font-size="16" fill="#64748b">&#8230;</text>
<line x1="377.0" y1="88" x2="377.0" y2="132" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="377.0" y1="226" x2="377.0" y2="260" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
</svg>
