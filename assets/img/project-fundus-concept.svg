<path d="M 169.0 198.0 C 173.3 197.0, 186.0 195.0, 195.0 192.0 C 204.0 189.0, 215.7 185.0, 223.0 180.0 C 230.3 175.0, 236.3 165.0, 239.0 162.0" fill="none" stroke="#a3301f" stroke-width="2.0" stroke-linecap="round" opacity="0.95"/>
