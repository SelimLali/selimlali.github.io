<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Pipeline overview</title>
<desc>1: sample EN-JA sentence pairs (10k in phase 1, 300k in phase 2, plus 1,996 test pairs). 2: fast difficulty score from length, rarity and LaBSE similarity. 3: LLM-judge difficulty with Qwen2.5-7B on a 1 to 5 scale. 4: curricula easy to hard, hard to easy and random. 5: zero-shot screening of 6 MT models in phase 1 and 6 base LMs in phase 2 to pick the model. 6: LoRA fine-tuning, one run per order with a fixed number of steps, then test-set evaluation with BLEU, chrF2, TER, COMET, CometKiwi and BERTScore.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L10 5 L0 9.2 z" fill="#8a8a8a"/></marker></defs>
<rect width="900" height="330" fill="#ffffff"/>
<rect x="16" y="112" width="166" height="118" rx="9" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.3"/><circle cx="40" cy="134" r="10.5" fill="#8c1515"/><text x="40" y="138" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text><text x="58" y="139" font-size="14.5" font-weight="700" fill="#1a1a1a">Sample</text><text x="30" y="161" font-size="12.2" fill="#555555">EN→JA sentence pairs</text><text x="30" y="177" font-size="12.2" fill="#555555">10k (phase 1)</text><text x="30" y="193" font-size="12.2" fill="#555555">300k (phase 2)</text><text x="30" y="209" font-size="12.2" fill="#555555">+ 1,996 test pairs</text>
<rect x="222" y="92" width="192" height="68" rx="9" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.3"/><circle cx="246" cy="114" r="10.5" fill="#8c1515"/><text x="246" y="118" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text><text x="264" y="119" font-size="14.5" font-weight="700" fill="#1a1a1a">Fast score</text><text x="236" y="141" font-size="12.2" fill="#555555">length, rarity, LaBSE</text>
<rect x="222" y="184" width="192" height="68" rx="9" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.3"/><circle cx="246" cy="206" r="10.5" fill="#8c1515"/><text x="246" y="210" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">3</text><text x="264" y="211" font-size="14.5" font-weight="700" fill="#1a1a1a">LLM judge</text><text x="236" y="233" font-size="12.2" fill="#555555">Qwen2.5-7B, scale 1 to 5</text>
<rect x="454" y="138" width="206" height="68" rx="9" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.3"/><circle cx="478" cy="160" r="10.5" fill="#8c1515"/><text x="478" y="164" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">4</text><text x="496" y="165" font-size="14.5" font-weight="700" fill="#1a1a1a">Curricula</text><text x="468" y="187" font-size="12.2" fill="#555555">easy→hard, hard→easy, random</text>
<rect x="430" y="14" width="454" height="68" rx="9" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.3"/><circle cx="454" cy="36" r="10.5" fill="#8c1515"/><text x="454" y="40" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">5</text><text x="472" y="41" font-size="14.5" font-weight="700" fill="#1a1a1a">Zero-shot screening</text><text x="444" y="63" font-size="12.2" fill="#555555">6 MT models (phase 1), 6 base LMs (phase 2): pick the model</text>
<rect x="700" y="130" width="184" height="84" rx="9" fill="#f9f0f0" stroke="#8c1515" stroke-width="1.6"/><circle cx="724" cy="152" r="10.5" fill="#8c1515"/><text x="724" y="156" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">6</text><text x="742" y="157" font-size="14.5" font-weight="700" fill="#1a1a1a">LoRA fine-tuning</text><text x="714" y="179" font-size="12.2" fill="#555555">one run per order,</text><text x="714" y="195" font-size="12.2" fill="#555555">fixed number of steps</text>
<rect x="700" y="244" width="184" height="74" rx="9" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.3"/><text x="714" y="271" font-size="14.5" font-weight="700" fill="#1a1a1a">Test-set evaluation</text><text x="714" y="293" font-size="12.2" fill="#555555">BLEU, chrF2, TER, COMET,</text><text x="714" y="309" font-size="12.2" fill="#555555">CometKiwi, BERTScore</text>
